# ① 受付窓口：Docker から送られてくるログを 24224番で受け取る
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ② 受け取ったログの行き先
<match techmeets.**>
  @type copy

  # 画面（Fluentd 自身のログ）にも表示する（確認用）
  <store>
    @type stdout
  </store>

  # ファイルにまとめて保存する（これが集中管理の本体）
  <store>
    @type file
    path /fluentd/log/techmeets
    append true
    <format>
      @type json
    </format>
    <buffer time>
      timekey 1d
      timekey_wait 10s
      flush_mode interval
      flush_interval 5s
    </buffer>
  </store>
</match>